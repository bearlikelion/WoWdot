<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="GDDocs">
<title>GDDocs</title>
<style>
:root {
	--bg: #f4f6f9;
	--panel: #ffffff;
	--sunk: #e9edf2;
	--line: #d6dce5;
	--text: #1c2330;
	--muted: #5b6473;
	--accent: #2d6aa0;
	--focus: #2d6aa0;
	--kw: #c2185b;
	--type: #0d7a5f;
	--user-type: #0b5c73;
	--fn: #1565c0;
	--member: #3f5f86;
	--str: #9a5b00;
	--num: #0f7a55;
	--anno: #b45309;
	--comment: #6b7280;
	--fam-2d: #3f5fd4;
	--fam-3d: #cf3f3f;
	--fam-ui: #2b8a3e;
	--fam-node: #6b7280;
	--fam-res: #b7791f;
	--fam-obj: #8a94a6;
	--sans: Inter, "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
	--mono: "JetBrains Mono", "Cascadia Code", "Fira Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
	color-scheme: light;
}

@media (prefers-color-scheme: dark) {
	:root {
		--bg: #1b1f27;
		--panel: #232833;
		--sunk: #171a21;
		--line: #333a47;
		--text: #dfe3ea;
		--muted: #949dac;
		--accent: #6ab0e8;
		--focus: #6ab0e8;
		--kw: #ff7085;
		--type: #42ffc2;
		--user-type: #c7ffed;
		--fn: #57b3ff;
		--member: #bce0ff;
		--str: #ffeda1;
		--num: #a1ffe0;
		--anno: #ffb373;
		--comment: #8a93a2;
		--fam-2d: #8da5f3;
		--fam-3d: #fc7f7f;
		--fam-ui: #8eef97;
		--fam-node: #e0e0e0;
		--fam-res: #ffca5f;
		--fam-obj: #a8b0bd;
		color-scheme: dark;
	}
}

* { box-sizing: border-box; }

body {
	margin: 0;
	background: var(--bg);
	color: var(--text);
	font: 15px/1.55 var(--sans);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a.external { text-decoration: underline dotted; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }

code, pre, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--sunk); padding: 0.1em 0.35em; border-radius: 4px; }
pre { background: var(--sunk); padding: 12px 14px; border-radius: 6px; overflow-x: auto; line-height: 1.45; }
pre code { background: none; padding: 0; }
kbd {
	font-family: var(--mono);
	font-size: 0.82em;
	border: 1px solid var(--line);
	border-bottom-width: 2px;
	border-radius: 4px;
	padding: 0.05em 0.4em;
	background: var(--panel);
	white-space: nowrap;
}

.topbar {
	position: sticky;
	top: 0;
	z-index: 10;
	display: flex;
	align-items: center;
	gap: 12px;
	height: 52px;
	padding-inline: 16px;
	background: var(--panel);
	border-bottom: 1px solid var(--line);
}
.topbar .project { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .version { color: var(--muted); font-size: 13px; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.search {
	width: min(340px, 45vw);
	font: inherit;
	font-size: 14px;
	color: var(--text);
	background: var(--sunk);
	border: 1px solid var(--line);
	border-radius: 6px;
	padding: 6px 10px;
}
.menu-toggle { display: none; }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); }

.sidebar {
	position: sticky;
	top: 52px;
	height: calc(100vh - 52px);
	overflow-y: auto;
	padding: 12px 10px 40px;
	background: var(--sunk);
	border-right: 1px solid var(--line);
	font-size: 14px;
}
.sidebar a, .sidebar summary {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 3px 8px;
	border-radius: 5px;
	color: var(--text);
	cursor: pointer;
}
.sidebar a:hover { background: var(--panel); text-decoration: none; }
.sidebar a.current { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
.sidebar .count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sidebar .heading {
	margin: 16px 8px 4px;
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.08em;
	text-transform: uppercase;
	color: var(--muted);
}
.sidebar summary { color: var(--muted); font-family: var(--mono); font-size: 12.5px; list-style: none; }
.sidebar summary::before { content: "\25B8"; font-size: 10px; transition: transform 0.12s; }
.sidebar details[open] > summary::before { transform: rotate(90deg); }
.sidebar details > div { padding-left: 12px; }
.sidebar .inner { padding-left: 26px; }
.sidebar .hit-kind { color: var(--muted); font-size: 11px; margin-left: auto; }
.sidebar .empty { padding: 6px 8px; color: var(--muted); }

.dot {
	flex: none;
	display: inline-block;
	width: 9px;
	height: 9px;
	border-radius: 2.5px;
	background: var(--fam-obj);
}
.dot.fam-2d { background: var(--fam-2d); }
.dot.fam-3d { background: var(--fam-3d); }
.dot.fam-ui { background: var(--fam-ui); }
.dot.fam-node { background: var(--fam-node); }
.dot.fam-res { background: var(--fam-res); }
.dot.engine { background: none; box-shadow: inset 0 0 0 1.5px var(--fam-obj); }
.dot.engine.fam-2d { box-shadow: inset 0 0 0 1.5px var(--fam-2d); }
.dot.engine.fam-3d { box-shadow: inset 0 0 0 1.5px var(--fam-3d); }
.dot.engine.fam-ui { box-shadow: inset 0 0 0 1.5px var(--fam-ui); }
.dot.engine.fam-node { box-shadow: inset 0 0 0 1.5px var(--fam-node); }
.dot.engine.fam-res { box-shadow: inset 0 0 0 1.5px var(--fam-res); }

.content { padding: 28px 40px 80px; max-width: 1040px; min-width: 0; }

.hero { margin-bottom: 18px; }
.hero .decl { font-family: var(--mono); font-size: clamp(20px, 3.2vw, 30px); font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.hero .decl .dot { width: 14px; height: 14px; border-radius: 3.5px; margin-right: 12px; vertical-align: 0.1em; }
.hero .sub { margin-top: 6px; color: var(--muted); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
h1.page { font-size: 28px; margin: 0 0 6px; }
.lede { color: var(--muted); margin: 0 0 18px; }

.badge {
	display: inline-block;
	font-family: var(--sans);
	font-size: 11px;
	font-weight: 700;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	padding: 1px 7px;
	margin-left: 8px;
	border-radius: 999px;
	border: 1px solid var(--line);
	color: var(--muted);
	vertical-align: 0.25em;
}
.badge.warn { color: var(--anno); border-color: currentColor; }

.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 14px 0 20px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }

.description { max-width: 72ch; }
.description p { margin: 0 0 0.8em; }

.bar {
	display: flex;
	align-items: center;
	gap: 10px;
	margin: 30px 0 0;
	padding: 6px 12px;
	background: var(--sunk);
	border: 1px solid var(--line);
	border-radius: 6px 6px 0 0;
	font-weight: 700;
	font-size: 13px;
}
.bar .count { color: var(--muted); font-weight: 400; }
.bar + .rows { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 6px 6px; background: var(--panel); }
.row { padding: 9px 14px; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.row:first-child { border-top: 0; }
.row:target, .row.flash { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.row .sig { font-family: var(--mono); font-size: 13.5px; overflow-x: auto; white-space: pre; }
.row .doc { margin-top: 3px; color: var(--muted); max-width: 80ch; }
.row .doc p { margin: 0 0 0.5em; }
.row .doc p:last-child { margin-bottom: 0; }
.row .note { margin-top: 3px; color: var(--anno); font-size: 13px; }

.toggle { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin: 8px 0 4px; }
.filter { font: inherit; font-size: 14px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; width: min(360px, 100%); }

.k { color: var(--kw); }
.t { color: var(--type); }
.u { color: var(--user-type); }
.f { color: var(--fn); }
.m { color: var(--member); }
.s { color: var(--str); }
.n { color: var(--num); }
.a { color: var(--anno); }
.c { color: var(--comment); }
.sig a:hover, .decl a:hover { text-decoration: underline; }

.tree { font-family: var(--mono); font-size: 13.5px; margin-top: 14px; }
.tree ul { list-style: none; margin: 0; padding-left: 22px; }
.tree > ul { padding-left: 0; }
.tree li { position: relative; }
.tree ul ul li::before {
	content: "";
	position: absolute;
	left: -14px;
	top: 0;
	bottom: 0;
	border-left: 1px solid var(--line);
}
.tree ul ul li:last-child::before { bottom: auto; height: 13px; }
.tree ul ul li::after {
	content: "";
	position: absolute;
	left: -14px;
	top: 13px;
	width: 10px;
	border-top: 1px solid var(--line);
}
.tree .node { display: inline-flex; align-items: center; gap: 7px; padding: 1px 6px; border-radius: 4px; }
.tree summary { list-style: none; cursor: pointer; }
.tree summary::-webkit-details-marker { display: none; }
.tree .node.engine, .tree .node.engine a { color: var(--muted); }
.tree .node .kids { color: var(--muted); font-size: 11.5px; }
.tree .node.match { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.tree .hidden { display: none; }

table.grid { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.table-wrap { overflow-x: auto; margin-top: 12px; }
table.grid th, table.grid td { text-align: left; vertical-align: top; padding: 8px 12px; border-top: 1px solid var(--line); }
table.grid th { background: var(--sunk); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-top: 0; }
table.grid td.mono { white-space: nowrap; }
table.grid td.path { white-space: normal; overflow-wrap: anywhere; min-width: 18ch; }
table.grid td.summary { min-width: 32ch; }

.guide { max-width: 78ch; }
.guide img { max-width: 100%; }
.guide table { border-collapse: collapse; }
.guide th, .guide td { border: 1px solid var(--line); padding: 5px 10px; }
.guide h1 { font-size: 30px; margin-top: 0; }
.guide hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
.guide blockquote { margin: 0 0 1em; padding-left: 14px; border-left: 3px solid var(--line); color: var(--muted); }

.empty-state { color: var(--muted); padding: 20px 0; }

@media (max-width: 820px) {
	.layout { grid-template-columns: minmax(0, 1fr); }
	.sidebar { position: static; height: auto; max-height: 60vh; display: none; border-right: 0; border-bottom: 1px solid var(--line); }
	.sidebar.open { display: block; }
	.menu-toggle { display: inline-block; font: inherit; font-size: 14px; background: var(--sunk); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
	.content { padding: 20px 16px 60px; }
	.topbar .version { display: none; }
	.search { width: 40vw; }
}

@media (prefers-reduced-motion: reduce) {
	* { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="topbar">
	<button class="menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false">Menu</button>
	<a class="project" id="project-name" href="#/">GDDocs</a>
	<span class="version" id="project-version"></span>
	<span class="spacer"></span>
	<input class="search" id="search" type="search" placeholder="Search classes, members, guides  /" aria-label="Search the documentation" autocomplete="off">
</header>
<div class="layout">
	<nav class="sidebar" id="sidebar" aria-label="Documentation"></nav>
	<main class="content" id="content"></main>
</div>
