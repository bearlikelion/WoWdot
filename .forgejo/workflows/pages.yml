name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The public GitHub repo that carries the site and the downloads. No source is ever pushed to it.
  SITE_REPO: bearlikelion/wowdot-site

jobs:
  pages:
    runs-on: docker
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm --needed git

      - uses: actions/checkout@v4

      - name: Build the site
        run: website/build.sh

      # Forgejo has no built-in Pages; a pages branch is what Codeberg's pages server and its self-hosted builds serve.
      - name: Publish to the pages branch
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cd _site
          git init -q -b pages
          git add -A
          git -c user.name="Forgejo Actions" -c user.email="actions@noreply.localhost" commit -q -m "Site for $SHA"
          git push -f "https://oauth2:${TOKEN}@${SERVER#https://}/${REPO}.git" pages

      - name: Publish to GitHub Pages
        env:
          TOKEN: ${{ secrets.SITE_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          rm -rf _site/.git
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="Forgejo Actions" -c user.email="actions@noreply.localhost" commit -q -m "Site for $SHA"
          git push -f "https://x-access-token:${TOKEN}@github.com/${SITE_REPO}.git" gh-pages
